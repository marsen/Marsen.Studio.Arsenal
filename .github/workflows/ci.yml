name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
    # 只改文件或本機設定時不跑 CI，也就不會觸發 Deploy
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.vscode/**'
      - '.claude/**'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build
        env:
          # sitemap / robots 在 build 時產生，requireBaseUrl() 沒設定會 fail fast
          NEXT_PUBLIC_BASE_URL: https://demo.marsen.me
